<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>維港轉生 - 測試版</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
    
    body {
        background-color: #2c2c2c;
        color: #fff;
        font-family: 'DotGothic16', monospace, "微軟正黑體";
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    #phone-container {
        width: 320px;
        height: 568px;
        background-color: #000;
        border: 4px solid #555;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    /* 碎芒特效 */
    #phone-container::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.1) 45%, rgba(255,255,255,0) 50%);
        pointer-events: none;
    }
    #status-bar {
        background-color: #075E54;
        padding: 5px 10px;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        border-bottom: 2px solid #128C7E;
    }
    #chat-header {
        background-color: #075E54;
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
    }
    #chat-header span { margin-left: 10px; }
    #chat-box {
        flex: 1;
        background-color: #E5DDD5;
        padding: 10px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .message {
        max-width: 70%;
        padding: 8px;
        border-radius: 5px;
        font-size: 14px;
        color: #000;
        position: relative;
    }
    .msg-system {
        align-self: center;
        background-color: rgba(0,0,0,0.5);
        color: #fff;
        font-size: 12px;
        border-radius: 10px;
        padding: 5px 10px;
    }
    .msg-mine {
        align-self: flex-end;
        background-color: #DCF8C6;
        border: 1px solid #c2e0aa;
    }
    .msg-her {
        align-self: flex-start;
        background-color: #FFF;
        border: 1px solid #ccc;
    }
    .blue-tick { color: #34B7F1; font-weight: bold; font-size: 12px; float: right; margin-top: 5px; }
    
    #controls {
        background-color: #f0f0f0;
        padding: 10px;
        display: flex;
        gap: 10px;
    }
    button {
        flex: 1;
        padding: 10px;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
        border: 2px solid #000;
        background-color: #fff;
        cursor: pointer;
        box-shadow: 2px 2px 0 #000;
    }
    button:active {
        box-shadow: 0 0 0 #000;
        transform: translate(2px, 2px);
    }
    
    /* 毒撚焦慮特效 */
    .anxiety-mode { animation: shake 0.5s infinite; }
    @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    
    #os-text {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: red;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px #000;
        display: none;
        width: 100%;
        text-align: center;
        pointer-events: none;
        z-index: 10;
    }
</style>
</head>
<body>

<div id="phone-container">
    <div id="status-bar">
        <span>信號: IIII</span>
        <span id="hp-display">電量(HP): 100%</span>
    </div>
    <div id="chat-header">
        👱‍♀️ <span>傲嬌女騎士</span>
    </div>
    <div id="chat-box">
        <div class="msg-system">你已添加 傲嬌女騎士 為聯絡人</div>
    </div>
    <div id="os-text">死啦！做咩已讀不回！</div>
    <div id="controls">
        <button id="btn-send" onclick="sendSticker()">Send 🐸</button>
        <button id="btn-breath" onclick="deepBreath()" disabled style="opacity:0.5;">深呼吸 (回血)</button>
    </div>
</div>

<script>
    let hp = 100;
    let anxietyTimer = null;
    let isAnxious = false;
    
    const chatBox = document.getElementById('chat-box');
    const hpDisplay = document.getElementById('hp-display');
    const btnSend = document.getElementById('btn-send');
    const btnBreath = document.getElementById('btn-breath');
    const phoneContainer = document.getElementById('phone-container');
    const osText = document.getElementById('os-text');

    function addMessage(text, type, ticks = '') {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = text + (ticks ? `<div class="blue-tick">${ticks}</div>` : '');
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendSticker() {
        btnSend.disabled = true;
        btnSend.style.opacity = '0.5';
        addMessage('🐸 (試探性遞茶)', 'msg-mine', '✓✓');
        
        // 模擬兩秒後雙藍剔
        setTimeout(() => {
            const ticks = document.querySelector('.blue-tick');
            if (ticks) ticks.innerHTML = '✓✓ <span style="color: blue;">已讀</span>';
            startAnxiety();
        }, 1500);
    }

    function startAnxiety() {
        isAnxious = true;
        btnBreath.disabled = false;
        btnBreath.style.opacity = '1';
        phoneContainer.classList.add('anxiety-mode');
        osText.style.display = 'block';
        
        // 每 0.5 秒扣一次 HP
        anxietyTimer = setInterval(() => {
            hp -= 3;
            if (hp <= 0) {
                hp = 0;
                gameOver(false);
            }
            updateHP();
            
            // 隨機彈出毒撚 OS
            const osThoughts = ["佢係咪憎我？", "做錯咩...", "點算點算", "佢打緊機？"];
            osText.innerText = osThoughts[Math.floor(Math.random() * osThoughts.length)];
        }, 500);

        // 設定 8 秒後女角才回覆
        setTimeout(() => {
            if (hp > 0) girlReplies();
        }, 8000);
    }

    function deepBreath() {
        if (!isAnxious) return;
        hp += 5; // 狂按按鈕回血對抗焦慮
        if (hp > 100) hp = 100;
        updateHP();
        phoneContainer.classList.remove('anxiety-mode');
        setTimeout(() => {
            if (isAnxious) phoneContainer.classList.add('anxiety-mode');
        }, 100);
    }

    function updateHP() {
        hpDisplay.innerText = `電量(HP): ${hp}%`;
        if (hp < 30) hpDisplay.style.color = "red";
        else hpDisplay.style.color = "white";
    }

    function girlReplies() {
        clearInterval(anxietyTimer);
        isAnxious = false;
        phoneContainer.classList.remove('anxiety-mode');
        osText.style.display = 'none';
        btnBreath.disabled = true;
        btnBreath.style.opacity = '0.5';
        
        addMessage('吵死了！大半夜傳甚麼奇怪青蛙！<br>...你剛才說有芒果班戟？', 'msg-her');
        setTimeout(() => {
            alert('🎉 任務成功！女騎士好感度上升！');
            btnSend.innerText = '下一關';
            btnSend.disabled = false;
            btnSend.style.opacity = '1';
        }, 500);
    }

    function gameOver(success) {
        clearInterval(anxietyTimer);
        isAnxious = false;
        phoneContainer.classList.remove('anxiety-mode');
        osText.style.display = 'none';
        btnBreath.disabled = true;
        
        addMessage('SYSTEM: 毒撚焦慮症發作，心臟停頓。Game Over。', 'msg-system');
        alert('💀 你的 HP (電量) 歸零，已在異世界社會性死亡。');
        location.reload();
    }
</script>
</body>
</html>
